# (선택) GitHub에 올려 매일 자동 실행하고 싶을 때:
# 이 파일을 .github/workflows/collect.yml 로 복사하면 매일 한국시간 07:10에 수집 후 data/를 커밋합니다.
# NCBI API 키가 있으면 저장소 Settings > Secrets 에 NCBI_API_KEY 로 등록하세요(없어도 동작).
name: collect-papers
on:
  schedule:
    - cron: "10 22 * * *"   # UTC 22:10 = KST 07:10
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m collector --days 2
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
      - run: |
          git config user.name "paper-collector-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "collect: $(date -u +%F)"
          git push
